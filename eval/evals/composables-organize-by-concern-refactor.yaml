rule: composables-organize-by-concern.md

prompt: |
  Improve useDashboard.ts:
  ```ts
  // useDashboard.ts
  export function useDashboard() {
    // All refs together
    const user = ref(null)
    const posts = ref([])
    const notifications = ref([])

    // All fetches together
    const fetchUser = async () => { /* ... */ }
    const fetchPosts = async () => { /* ... */ }
    const fetchNotifications = async () => { /* ... */ }

    return { user, posts, notifications, fetchUser, fetchPosts, fetchNotifications }
  }
  ```
  Write the improved version to useDashboard.ts.
checks:
  - id: organized-by-concern
    type: ai-judge
    criteria: |
      Is the refactored code organized by logical concern (user-related code together,
      posts-related code together, notifications-related code together) rather than
      by API type (all refs together, all functions together)?
