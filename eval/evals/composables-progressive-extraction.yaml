rule: composables-progressive-extraction.md
category: composables
trials: 1

prompt: |
  Create a Vue 3 component called SearchPage. It has a search
  input, fetches results from an API, and displays them. The search
  logic is only used in this one component.

checks:
  - id: inline-or-colocated
    type: ai-judge
    criteria: |
      Is the search logic kept inline in the component's script setup
      (or in a colocated file next to the component), rather than
      prematurely extracted to a shared composables/ directory?
      PASS if inline or colocated, FAIL if extracted to shared composables/.
