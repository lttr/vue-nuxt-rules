rule: no-side-effects-in-computed.md
category: props-state
trials: 1

prompt: |
  Create a Vue 3 component with a list of products (name, price, inStock boolean).
  Add a computed that filters to in-stock items and also updates a "lastFilteredCount" ref with the count.

checks:
  - id: no-ref-assignment-in-computed
    type: ai-judge
    criteria: The computed property must NOT assign to any .value (no side effects). Using watch() or a separate computed for the count is correct.
